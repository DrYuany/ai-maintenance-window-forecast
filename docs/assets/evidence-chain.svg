<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="268" viewBox="0 0 1200 268" role="img" aria-label="一次求解的证据链">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9db0bf"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="268" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1199" height="267" fill="none" stroke="#e3eaf0"/>

  <text x="40" y="46" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="14" font-weight="600" fill="#16232e" letter-spacing="0.04em">一次求解的证据链</text>
  <text x="1160" y="46" text-anchor="end" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" fill="#7a8b9a">样例 2026-10-29 19:56 · 合成数据 · 12 项任务</text>
  <line x1="40" y1="62" x2="1160" y2="62" stroke="#eef2f6"/>

  <!-- ① 输入 -->
  <rect x="40" y="96" width="184" height="112" rx="10" fill="#fbfcfd" stroke="#e0e8ee"/>
  <text x="58" y="122" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#8496a5">① 输入</text>
  <text x="58" y="153" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="17" font-weight="600" fill="#16232e">一句话诉求</text>
  <text x="58" y="180" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#6b7c8c">优先高风险 · 船租+20%</text>

  <line x1="232" y1="152" x2="264" y2="152" stroke="#9db0bf" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- ② 编译 -->
  <rect x="274" y="96" width="184" height="112" rx="10" fill="#fbfcfd" stroke="#e0e8ee"/>
  <text x="292" y="122" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#8496a5">② 编译</text>
  <text x="292" y="153" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="17" font-weight="600" fill="#16232e">固定模型契约</text>
  <text x="292" y="180" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#6b7c8c">122 参数 · 100 台风机</text>

  <line x1="466" y1="152" x2="498" y2="152" stroke="#9db0bf" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- ③ 求解 -->
  <rect x="508" y="96" width="184" height="112" rx="10" fill="#f1f8f5" stroke="#bfdfd3"/>
  <text x="526" y="122" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#5f8a7c">③ 求解</text>
  <text x="526" y="153" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="17" font-weight="600" fill="#0f5748">CP-SAT 30 段</text>
  <text x="526" y="180" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#4a7a6b">全部 OPTIMAL · gap 0</text>

  <line x1="700" y1="152" x2="732" y2="152" stroke="#9db0bf" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- ④ 复核 -->
  <rect x="742" y="96" width="184" height="112" rx="10" fill="#fbfcfd" stroke="#e0e8ee"/>
  <text x="760" y="122" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#8496a5">④ 复核</text>
  <text x="760" y="153" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="17" font-weight="600" fill="#16232e">独立重算</text>
  <text x="760" y="180" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#6b7c8c">费用 + 排程重算</text>

  <line x1="934" y1="152" x2="966" y2="152" stroke="#9db0bf" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- ⑤ 留证 -->
  <rect x="976" y="96" width="184" height="112" rx="10" fill="#fbfcfd" stroke="#e0e8ee"/>
  <text x="994" y="122" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#8496a5">⑤ 留证</text>
  <text x="994" y="153" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="17" font-weight="600" fill="#16232e">37 个文件</text>
  <text x="994" y="180" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#6b7c8c">指纹 0596… · pbtxt 可重跑</text>

  <text x="40" y="240" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" fill="#7a8b9a">同一份契约 + 同一时限 = 同一结论（25 段决胜目标保证）；赢不了就写「不宣称同等服务节省」。</text>
</svg>
